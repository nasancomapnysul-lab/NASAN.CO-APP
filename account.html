<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>nasan Company — Account</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'unsafe-inline'; img-src 'self'; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="strict-origin">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F4F2EE; color: #20262A; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width: min(380px, calc(100% - 36px)); background: #fff; border: 1px solid rgba(32,38,42,0.1); border-radius: 18px; padding: 30px 26px 24px; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 20px; margin: 14px 0 6px; letter-spacing: -0.02em; }
  p { margin: 0; color: #6B7478; font-size: 13.5px; }
  .f { position: relative; margin-top: 14px; }
  input { width: 100%; box-sizing: border-box; height: 48px; padding: 0 46px 0 14px; border-radius: 12px; border: 1px solid rgba(32,38,42,0.16); background: #F7F6F3; font: 500 15px system-ui, sans-serif; color: #20262A; outline: none; }
  input:focus { border-color: #46A4AC; }
  .eye { position: absolute; right: 6px; top: 6px; width: 36px; height: 36px; border: 0; background: none; cursor: pointer; color: #6B7478; font-size: 13px; }
  button.go { margin-top: 18px; width: 100%; height: 48px; border: 0; border-radius: 100px; background: #46A4AC; color: #0E2124; font: 700 15px system-ui, sans-serif; cursor: pointer; }
  button.go:disabled { background: rgba(32,38,42,0.12); color: rgba(32,38,42,0.45); cursor: default; }
  .msg { margin-top: 12px; min-height: 20px; font-size: 13px; }
  .bad { color: #D2483C; } .ok { color: #1E8A54; }
  ul { text-align: left; margin: 12px 0 0; padding-left: 18px; color: #6B7478; font-size: 12.5px; }
  li.y { color: #1E8A54; }
  a { color: #2C8F99; }
</style>
</head>
<body>
<div class="card" id="card">
  <img src="nasan-logo.png" alt="nasan Company">
  <h1 id="t">One moment…</h1>
  <p id="s"></p>
  <div id="form" hidden>
    <div class="f"><input id="p1" type="password" autocomplete="new-password" placeholder="New password" maxlength="128"><button class="eye" type="button" data-for="p1">Show</button></div>
    <div class="f"><input id="p2" type="password" autocomplete="new-password" placeholder="Type it again" maxlength="128"><button class="eye" type="button" data-for="p2">Show</button></div>
    <ul><li id="r1">At least 12 characters</li><li id="r2">Letters and numbers</li><li id="r3">Both boxes match</li></ul>
    <button class="go" id="go" disabled>Save new password</button>
  </div>
  <div class="msg" id="m"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" integrity="sha384-AQ3POAMqIhwS81FrUH95ekxqBZHeP5tG2JfEL3+7GuTtfRLWnrRh32UxwzM+//A9" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" integrity="sha384-TnlRYaR4JYz/lpaGuaiU61PjNberSA4vjLjtF+oRC/IkohkJqnWxw5EmDSOt1vA1" crossorigin="anonymous"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var say = function (t, s) { $('t').textContent = t; $('s').textContent = s || ''; };
  var msg = function (t, cls) { $('m').textContent = t; $('m').className = 'msg ' + (cls || ''); };
  var q = new URLSearchParams(location.search);
  var mode = q.get('mode'), code = q.get('oobCode');
  if (!window.firebase || !code) { say('This link is not complete', 'Open the newest email and tap the link again.'); return; }
  firebase.initializeApp({ apiKey: 'AIzaSyBCg5D80QGl-8aE_qX7RPtu7b403ssjKQc', authDomain: 'nasan-co-team.firebaseapp.com', projectId: 'nasan-co-team' });
  var auth = firebase.auth();
  var why = function (e) {
    var c = (e && e.code) || '';
    if (/expired/.test(c)) return 'This link has expired. Ask for a new email and use the newest one.';
    if (/invalid-action-code/.test(c)) return 'This link was already used or is not the newest one. Ask for a new email.';
    if (/weak-password/.test(c)) return 'That password is too weak. Choose a longer one.';
    if (/user-disabled/.test(c)) return 'This account is turned off.';
    if (/network/.test(c)) return 'No connection. Check the internet and try again.';
    if (/too-many/.test(c)) return 'Too many tries. Wait a few minutes.';
    return 'Something went wrong (' + (c || 'unknown') + ').';
  };
  document.querySelectorAll('.eye').forEach(function (b) {
    b.addEventListener('click', function () { var i = $(b.getAttribute('data-for')); var show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show'; });
  });
  if (mode === 'resetPassword') {
    say('Checking your link…');
    auth.verifyPasswordResetCode(code).then(function (email) {
      say('Choose a new password', email);
      $('form').hidden = false;
      var check = function () {
        var a = $('p1').value, b = $('p2').value;
        var k1 = a.length >= 12, k2 = /[a-z]/i.test(a) && /\d/.test(a), k3 = a.length > 0 && a === b;
        $('r1').className = k1 ? 'y' : ''; $('r2').className = k2 ? 'y' : ''; $('r3').className = k3 ? 'y' : '';
        $('go').disabled = !(k1 && k2 && k3);
      };
      $('p1').addEventListener('input', check); $('p2').addEventListener('input', check);
      $('go').addEventListener('click', function () {
        $('go').disabled = true; msg('Saving…');
        auth.confirmPasswordReset(code, $('p1').value).then(function () {
          $('form').hidden = true; msg('');
          say('Password changed', 'You can now sign in with your new password.');
        }).catch(function (e) { msg(why(e), 'bad'); $('go').disabled = false; });
      });
    }).catch(function (e) { say('This link does not work', why(e)); });
  } else if (mode === 'verifyEmail') {
    say('Checking your email…');
    auth.applyActionCode(code).then(function () { say('Email confirmed', 'Thank you. You can close this page and go back to the app.'); })
      .catch(function (e) { say('This link does not work', why(e)); });
  } else if (mode === 'recoverEmail') {
    auth.checkActionCode(code).then(function (info) { return auth.applyActionCode(code).then(function () { say('Email changed back', 'Your account email is ' + ((info.data && info.data.email) || 'restored') + ' again. Change your password to be safe.'); }); })
      .catch(function (e) { say('This link does not work', why(e)); });
  } else {
    say('This link is not complete', 'Open the newest email and tap the link again.');
  }
})();
</script>
</body>
</html>
