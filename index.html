<style>
  html,body{margin:0;height:100%;background:#121618;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  /* phones: the app fills the whole screen, no phone frame */
  #root{position:fixed;inset:0;overflow:hidden}
  #root>div{width:100%;height:100%}
  #side{display:none}
  /* tablets + laptops: the app sits in a phone-width column in the middle */
  @media (min-width:640px){
    body{background:radial-gradient(900px 600px at 50% 0%,#1d2629,#121618 70%)}
    #root{display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box}
    #root>div{width:430px!important;max-width:100%;height:min(100%,932px)!important;flex:none;border-radius:32px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);transform:translateZ(0)}
  }
  @media (min-width:1080px){
    #root{justify-content:flex-start;padding-left:calc(50% - 215px)}
    #side{display:flex;position:fixed;top:50%;transform:translateY(-50%);left:calc(50% + 260px);width:280px;flex-direction:column;gap:14px;font:400 14px/1.5 -apple-system,system-ui,sans-serif;color:rgba(255,255,255,.7)}
    #side img{width:64px;height:64px;border-radius:64px}
    #side b{font:700 20px/1.25 -apple-system,system-ui,sans-serif;color:#fff;letter-spacing:-.01em}
    #side a.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:100px;background:#3FB2BD;color:#0E2124;font:700 14px/1 -apple-system,system-ui,sans-serif;text-decoration:none}
    #side a.btn:hover{background:#56c3cd;color:#0E2124}
  }
  a{color:#2E8C95} a:hover{color:#3FB2BD}
  input,textarea,select{font-size:16px}
  @keyframes bootP{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.94);opacity:.75}}
</style>
